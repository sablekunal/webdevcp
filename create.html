<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Tournament | SportIQ</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png"/>
  
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/main.css"/>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between">

  <!-- Simple Header -->
  <header class="glass-nav sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-md">
          <i class="fa-solid fa-trophy"></i>
        </div>
        <span class="font-extrabold text-2xl tracking-tight text-slate-900">SportIQ Organizer</span>
      </a>
    </div>
  </header>

  <main class="flex-grow flex items-center justify-center py-12 px-4">
    <div class="bg-white max-w-lg w-full p-8 rounded-3xl shadow-xl border border-slate-200">
      <h2 class="text-2xl font-black text-slate-900 mb-2">Create New Tournament</h2>
      <p class="text-slate-500 text-sm mb-6">Launch a live tournament page instantly.</p>
      
      <form id="create-tournament-form" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Tournament Name</label>
          <input type="text" id="t-name" required placeholder="e.g. Summer Throwball Cup" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"/>
        </div>
        
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Organizer / Presenter</label>
          <input type="text" id="t-organizer" required placeholder="e.g. St. Xavier's Youth" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"/>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Sport</label>
            <select id="t-sport" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 bg-white">
              <option value="Throwball">Throwball</option>
              <option value="Volleyball">Volleyball</option>
              <option value="Cricket">Cricket</option>
              <option value="Football">Football</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Date</label>
            <input type="date" id="t-date" required class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 transition"/>
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Venue Location</label>
          <input type="text" id="t-venue" required placeholder="e.g. Barco Hall Ground, Pune" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 transition"/>
        </div>

        <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-500/30 transition-all flex justify-center items-center gap-2 mt-4">
          <i class="fa-solid fa-rocket"></i> Publish Tournament Live
        </button>
      </form>
    </div>
  </main>

  <script src="assets/js/main.js"></script>
  <!-- Load Firebase script as module -->
  <script type="module" src="assets/js/create.js"></script>
</body>
</html>
